<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b3191c" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- the title, description, social tags and structured data are different on every page,
         so they aren't written here. each page renders a <Seo />, and
         scripts/prerender.ts writes the result into this spot at build time -->
    <!--page-head-->
  </head>
  <body>
    <!-- React draws everything in this div. after `npm run build` it already arrives
         filled in (scripts/prerender.ts), so search engines and link previews see real HTML -->
    <div id="root"><!--page-body--></div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Vercel Web Analytics: first-party route, no cookies, no third-party host.
         the file only exists on Vercel, so a 404 for it on localhost is expected -->
    <script defer src="/_vercel/insights/script.js" vite-ignore></script>
  </body>
</html>
